[project]
name = "slack_manifest_schema"
version = "0.0.0"
description = "Slack manifest schema"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Slack Technologies, LLC", email = "opensource@slack.com" }]
dependencies = [
	"ruff==0.16.10",
	"pytest==9.1.1",
	"jsonschema==4.26.0",
]

[tool.setuptools]
packages = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "D"]
ignore = [
	# missing-docstring: do not add docstrings where none exist
	"D100",
	"D101",
	"D102",
	"D103",
	"D104",
	"D105",
	"D106",
	"D107",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
log_file = "logs/pytest.log"
log_file_level = "DEBUG"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
